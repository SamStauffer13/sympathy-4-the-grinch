<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sympathy 4 the Grinch</title>
    <meta name="description" content="Rob Santa. Don't get caught. A tiny Christmas scavenger-hunt game." />
    <meta name="theme-color" content="#12001f" />
    <meta property="og:title" content="Sympathy 4 the Grinch" />
    <meta property="og:description" content="Rob Santa. Don't get caught. A tiny Christmas scavenger-hunt game." />
    <meta property="og:image" content="https://samstauffer.net/sympathy-4-the-grinch/img/american-dream.png" />
    <meta property="og:url" content="https://samstauffer.net/sympathy-4-the-grinch/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #12001f; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', Impact, sans-serif; }
      #rotate {
        display: none; position: absolute; top: 5vh; left: 0; right: 0; padding: 0 16px; text-align: center;
        color: #39ff14; font-size: 20px;
      }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } }
      #stage { position: relative; width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9; }
      canvas { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
      /* YouTube needs its player visible at 200x200 or more; the top right of the sky is clear of the action */
      #music { position: absolute; top: 10%; right: 1%; width: 200px; height: 200px; border: 0; pointer-events: none; }
      #mute {
        position: absolute; left: 1.5%; bottom: 2%; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
        font-size: 22px; background: rgba(255, 255, 255, 0.15); box-shadow: none; cursor: pointer;
      }
      #screen {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2.2vmin; padding: 4vmin; box-sizing: border-box; text-align: center; color: #fff;
        background: rgba(18, 0, 31, 0.94);
      }
      #screen[hidden] { display: none; }
      h1 { margin: 0; font-size: clamp(24px, 6vw, 64px); color: #ff2bd6; text-shadow: 0.05em 0.05em #00f0ff; }
      p { margin: 0; max-width: 28em; white-space: pre-wrap; font-family: Arial, sans-serif; font-weight: bold; font-size: clamp(16px, 3vw, 30px); }
      #clue {
        position: relative; margin: 2.5vmin 0 1vmin; padding: 3.5vmin 5vmin 2.8vmin; max-width: 85%; box-sizing: border-box;
        background: #12001f; border: max(3px, 0.5vmin) solid #39ff14; border-radius: 2vmin; box-shadow: max(4px, 1vmin) max(4px, 1vmin) #ff2bd6;
        animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #clue[hidden] { display: none; }
      #clue span {
        position: absolute; top: 0; left: 50%; transform: translate(-50%, -55%); white-space: nowrap;
        padding: 0.5vmin 2.5vmin; border-radius: 999px; background: #ff2bd6; color: #fff;
        font-size: clamp(12px, 2.4vw, 24px); letter-spacing: 0.15em; text-transform: uppercase;
      }
      #clue strong { font-size: clamp(26px, 6.5vw, 70px); line-height: 1.1; text-shadow: 0.05em 0.05em #00f0ff; }
      @keyframes pop { from { transform: scale(0.4) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
      small { font-family: Arial, sans-serif; font-size: clamp(12px, 2vw, 20px); color: #39ff14; }
      button {
        font: inherit; font-size: clamp(18px, 3.5vw, 36px); padding: 0.4em 1.2em; border: 0; border-radius: 999px;
        background: #39ff14; color: #12001f; cursor: pointer; box-shadow: 0.1em 0.1em #ff2bd6;
      }
    </style>
  </head>
  <body>
    <div id="rotate">📱↻ Turn your phone sideways for a bigger game!</div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="music"></div>
      <div id="screen">
        <h1></h1>
        <p></p>
        <div id="clue" hidden><span></span><strong></strong></div>
        <small></small>
        <button></button>
      </div>
      <button id="mute" aria-label="Mute music">🔊</button>
    </div>
    <script src="game.js"></script>
  </body>
</html>
