<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sympathy 4 the Grinch</title>
    <style>
      html, body { margin: 0; height: 100%; background: #12001f; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', Impact, sans-serif; }
      #stage { position: relative; width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9; }
      canvas { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
      #screen {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2.2vmin; padding: 4vmin; box-sizing: border-box; text-align: center; color: #fff;
        background: rgba(18, 0, 31, 0.88);
      }
      #screen[hidden] { display: none; }
      h1 { margin: 0; font-size: clamp(24px, 6vw, 64px); color: #ff2bd6; text-shadow: 0.05em 0.05em #00f0ff; }
      p { margin: 0; max-width: 28em; white-space: pre-wrap; font-family: Arial, sans-serif; font-weight: bold; font-size: clamp(16px, 3vw, 30px); }
      small { font-family: Arial, sans-serif; font-size: clamp(12px, 2vw, 20px); color: #39ff14; }
      button {
        font: inherit; font-size: clamp(18px, 3.5vw, 36px); padding: 0.4em 1.2em; border: 0; border-radius: 999px;
        background: #39ff14; color: #12001f; cursor: pointer; box-shadow: 0.1em 0.1em #ff2bd6;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="screen">
        <h1></h1>
        <p></p>
        <small></small>
        <button></button>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
